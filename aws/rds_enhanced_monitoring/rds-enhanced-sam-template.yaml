AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pushes RDS Enhanced metrics to Datadog.
Parameters:
  KMSKeyId:
    Type: String
    Description: The id (final part of the key's ARN) of a KMS key used to encrypt and decrypt your Datadog API and App keys.
  KmsEncryptedKeys:
    Type: String
    Default: ''
    NoEcho: true
    Description: 'Datadog API (and optionally APP) key(s), KMS-encrypted with EncryptionContext, as a JSON blob. Leave blank if using one of the other options below.'
  DdApiKeySecretArn:
    Type: String
    Default: ''
    Description: 'ARN of an AWS Secrets Manager secret containing your Datadog API key. Leave blank if using one of the other options.'
  DdApiKeySsmName:
    Type: String
    Default: ''
    Description: 'Name (or ARN, if in another region) of an AWS SSM parameter containing your Datadog API key. Leave blank if using one of the other options.'
  DdKmsApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: 'Datadog API key, KMS-encrypted (CiphertextBlob). Leave blank if using one of the other options.'
  DdApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: 'Not recommended: your Datadog API key in plaintext. Leave blank if using one of the other options.'
Conditions:
  HasKmsEncryptedKeys: !Not [!Equals [!Ref KmsEncryptedKeys, '']]
  HasDdApiKeySecretArn: !Not [!Equals [!Ref DdApiKeySecretArn, '']]
  HasDdApiKeySsmName: !Not [!Equals [!Ref DdApiKeySsmName, '']]
  HasDdKmsApiKey: !Not [!Equals [!Ref DdKmsApiKey, '']]
  HasDdApiKey: !Not [!Equals [!Ref DdApiKey, '']]
Resources:
  rdslambdaddfunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      Description: Pushes RDS Enhanced metrics to Datadog.
      Environment:
        Variables:
          kmsEncryptedKeys: !If [HasKmsEncryptedKeys, !Ref KmsEncryptedKeys, !Ref 'AWS::NoValue']
          DD_API_KEY_SECRET_ARN: !If [HasDdApiKeySecretArn, !Ref DdApiKeySecretArn, !Ref 'AWS::NoValue']
          DD_API_KEY_SSM_NAME: !If [HasDdApiKeySsmName, !Ref DdApiKeySsmName, !Ref 'AWS::NoValue']
          DD_KMS_API_KEY: !If [HasDdKmsApiKey, !Ref DdKmsApiKey, !Ref 'AWS::NoValue']
          DD_API_KEY: !If [HasDdApiKey, !Ref DdApiKey, !Ref 'AWS::NoValue']
      Handler: lambda_function.lambda_handler
      MemorySize: 128
      Policies:
        KMSDecryptPolicy:
          KeyId: !Ref KMSKeyId
      Architectures:
        - arm64
      Runtime: python3.14
      Timeout: 10
      KmsKeyArn:
        !Sub
          - 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/${keyId}'
          - {keyId: !Ref KMSKeyId}
